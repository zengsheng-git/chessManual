[package]
name = "chessmanual"
version = "0.1.0"
description = "棋枰棋谱 - 中国象棋棋谱整理与复盘"
edition = "2021"

[lib]
name = "chessmanual_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.5"
ndarray = "0.16"
image = "0.25"
tauri-plugin-dialog = "2"
# 删除棋谱时移入系统回收站(而非直接删文件), 误删可恢复
trash = "5"

# ONNX Runtime 仅在 Windows 下启用, 运行时动态加载 onnxruntime.dll, 不参与编译链接
[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "=2.0.0-rc.9", default-features = false, features = ["ndarray", "load-dynamic"] }

[profile.dev]
incremental = true
